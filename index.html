<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元旦神秘礼物🎁</title>
    <meta name="description" content="悄悄准备了一份元旦惊喜，快来拆开它吧！">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 装饰元素 -->
    <div class="decorations">
        <div class="decoration deer">🦌</div>
        <div class="decoration gift1">🎁</div>
        <div class="decoration gift2">🎁</div>
        <div class="decoration party">🎉</div>
        <div class="decoration firework">🎇</div>
        <div class="decoration candy1">🍬</div>
        <div class="decoration candy2">🍭</div>
        <div class="decoration flower">🌸</div>
    </div>

    <!-- 主卡片 -->
    <div class="card">
        <!-- 礼物盒图标 -->
        <div class="gift-box">
            <svg viewBox="0 0 100 100" class="gift-svg">
                <!-- 礼物盒身体 -->
                <rect x="15" y="45" width="70" height="45" rx="5" fill="#FF69B4"/>
                <!-- 礼物盒盖子 -->
                <rect x="10" y="35" width="80" height="15" rx="3" fill="#FF1493"/>
                <!-- 垂直丝带 -->
                <rect x="42" y="35" width="16" height="55" fill="#4169E1"/>
                <!-- 水平丝带 -->
                <rect x="10" y="40" width="80" height="8" fill="#6495ED"/>
                <!-- 蝴蝶结左边 -->
                <ellipse cx="35" cy="28" rx="15" ry="12" fill="#8A2BE2"/>
                <!-- 蝴蝶结右边 -->
                <ellipse cx="65" cy="28" rx="15" ry="12" fill="#8A2BE2"/>
                <!-- 蝴蝶结中心 -->
                <circle cx="50" cy="30" r="8" fill="#9400D3"/>
                <!-- 蝴蝶结尾巴 -->
                <path d="M42 35 Q50 45 58 35" stroke="#6A0DAD" stroke-width="3" fill="none"/>
            </svg>
        </div>

        <!-- 标题 -->
        <h1 class="title">元旦神秘礼物</h1>
        
        <!-- 描述 -->
        <p class="description">悄悄准备了一份元旦惊喜，快来拆开它吧！</p>
        
        <!-- 抽奖按钮 -->
        <button class="lottery-btn" id="lotteryBtn">
            立刻开启神秘礼物 ✨
        </button>
    </div>

    <!-- 结果弹窗 -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <div class="result-icon" id="resultIcon">🎊</div>
            <h2 class="result-title" id="resultTitle">恭喜你！</h2>
            <div class="prize-info">
                <span class="prize-level" id="prizeLevel">一等奖</span>
                <p class="prize-detail" id="prizeDetail">52元红包</p>
            </div>
            <p class="result-tip">截图发给ta领取奖励哦~</p>
            <button class="retry-btn" id="retryBtn">再抽一次 🎁</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
